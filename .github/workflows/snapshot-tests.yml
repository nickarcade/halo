name: Snapshot Verification

# Runs on the self-hosted runner only. This job needs two artifacts that are
# deliberately never committed, because they are original-XBE-derived:
#
#   delinked/game_state.obj  - COFF slice exported from the original binary
#   ci/snapshot.json         - converted from a live RAM capture
#
# See docs/repository-artifact-cleanup.md. On a GitHub-hosted runner neither
# file exists after checkout, so the job could only ever fail -- which is what
# it did for its last 8 runs before this was fixed. They are COPIED in from the
# host by .github/actions/stage-local-assets; that action's header explains why
# they are no longer symlinked.

on:
  push:
    paths:
      - "src/**"
      - "tools/equivalence/**"
      - "kb.json"
      - ".github/workflows/snapshot-tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "tools/equivalence/**"
      - "kb.json"
  workflow_dispatch:

env:
  VENV_PYTHON: /mnt/g/dev/halo/.venv/bin/python3
  # Host directory the never-committed assets (halo-patched/, delinked/, and
  # the ci/ RAM capture) are copied out of.
  SOURCE_ROOT: /mnt/g/dev/halo

jobs:
  verify:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Stage local assets
        uses: ./.github/actions/stage-local-assets
        with:
          xbe: "true"
          delinked: "true"
          ci: "true"
          source-root: ${{ env.SOURCE_ROOT }}
          required: >-
            delinked/game_state.obj
            halo-patched/cachebeta.xbe
            ci/snapshot.json

      - name: Verify prerequisites
        run: ${{ env.VENV_PYTHON }} -c "import unicorn, capstone; print('deps ok')"

      - name: Build
        run: |
          cmake -Bbuild -S. -DCMAKE_TOOLCHAIN_FILE=toolchains/llvm.cmake
          ${{ env.VENV_PYTHON }} tools/build/build.py -q --target halo
        timeout-minutes: 20

      - name: Run snapshot verification
        run: |
          mkdir -p artifacts/progress artifacts/equivalence
          ${{ env.VENV_PYTHON }} tools/equivalence/game_state_verify.py \
            --snapshot ci/snapshot.json \
            --objects game_state.obj \
            --seeds 25 \
            --output artifacts/equivalence/ci_results.json
          cp artifacts/equivalence/ci_results.json artifacts/progress/snapshot_results.json
        timeout-minutes: 20

      - name: Generate progress report
        if: always()
        run: |
          ${{ env.VENV_PYTHON }} tools/report/generate_decomp_report.py \
            -o artifacts/progress/report.json \
            --html artifacts/progress/index.html

      - name: Report results
        if: always()
        run: |
          if [ ! -f artifacts/equivalence/ci_results.json ]; then
            echo "Snapshot verification produced no results; see the earlier failed step."
            exit 0
          fi
          ${{ env.VENV_PYTHON }} -c "
          import json
          with open('artifacts/equivalence/ci_results.json') as f:
              r = json.load(f)
          s = r.get('summary', {})
          total = s.get('total', 0)
          passed = s.get('passed', 0)
          print(f'{passed}/{total} functions passed snapshot verification')
          for res in r.get('results', []):
              if res.get('error'):
                  print(f'  FAIL  {res[\"func\"]}  {res[\"error\"]}')
              elif res.get('passed', 0) != res.get('total_seeds', 0) or res.get('errors', 0):
                  print(f'  FAIL  {res[\"func\"]}  cov={res.get(\"coverage\", 0):.0f}%')
              else:
                  print(f'  PASS  {res[\"func\"]}  cov={res.get(\"coverage\", 0):.0f}%')
          "

      # An unexpected fail/error fails the job; a not_applicable or
      # inconclusive verdict, and anything listed in the policy file with a
      # reviewed reason, does not.  Per-branch proof for the inconclusive
      # lifecycle routines lives in tools/equivalence/regression_targets.json.
      - name: Gate results against reviewed exceptions
        if: always()
        run: |
          ${{ env.VENV_PYTHON }} tools/equivalence/check_snapshot_results.py \
            artifacts/equivalence/ci_results.json \
            --github-summary
