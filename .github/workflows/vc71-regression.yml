name: Raw-XBE Byte Regression

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Revision to compare against (freshly compiled)
        default: HEAD^
        required: true
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'src/**'
      - 'kb.json'
      - 'third_party/xbox/**'
      - 'toolchains/**'
      - 'tools/analysis/**'
      - 'tools/verify/**'
      - 'tools/audit/check_delinked_bounds.py'
      - 'tools/equivalence/xbe_image.py'
      - '.github/actions/stage-local-assets/**'
      - '.github/workflows/vc71-regression.yml'

permissions:
  contents: read

concurrency:
  group: byte-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  byte-regression:
    name: Raw-XBE byte regression
    runs-on: self-hosted
    timeout-minutes: 120
    env:
      VENV_PYTHON: ${{ vars.HALO_HOST_TREE || '/mnt/g/dev/halo' }}/.venv/bin/python3
    steps:
      # Measure the PR merge revision so base-branch integration is covered.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve baseline revision
        id: baseline
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || inputs.base_ref || 'HEAD^' }}
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse --verify "$BASE_REF^{commit}")" >> "$GITHUB_OUTPUT"

      - name: Check out baseline separately
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.baseline.outputs.sha }}
          path: byte-base
          fetch-depth: 1

      - name: Stage pristine XBE
        uses: ./.github/actions/stage-local-assets
        with:
          xbe: "true"
          required: halo-patched/cachebeta.xbe

      - name: Test byte gate and comparison semantics
        shell: bash
        run: |
          set -euo pipefail
          PY="$VENV_PYTHON"
          [ -x "$PY" ] || PY=python3
          "$PY" -m unittest discover -s tools/verify -p 'test_byte_regression.py'
          "$PY" -m unittest discover -s tools/verify -p 'test_raw_xbe_structural.py'
          "$PY" -m unittest discover -s tools/verify -p 'test_raw_byte_audit.py'

      - name: Compile both revisions and check raw-XBE byte regressions
        shell: bash
        env:
          BASE_SHA: ${{ steps.baseline.outputs.sha }}
        run: |
          set -euo pipefail
          PY="$VENV_PYTHON"
          [ -x "$PY" ] || PY=python3
          "$PY" tools/verify/byte_regression.py check \
            --base-root byte-base --base-commit "$BASE_SHA" \
            --head-commit "$GITHUB_SHA" --workers 4 \
            --output "$GITHUB_WORKSPACE/artifacts/byte_regression/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

      - name: Upload byte measurements and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: byte-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/byte_regression/
          if-no-files-found: warn
          retention-days: 14
